<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aftercode — Loading preview</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; background: #08090c; }

      .loading-screen {
        position: relative;
        isolation: isolate;
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.15rem;
        overflow: hidden;
        color: #f9f7ee;
        background: #08090c;
      }

      .loading-screen::before,
      .loading-screen::after {
        display: none;
      }

      .loading-screen::before {
        top: -15vw;
        left: -10vw;
        background: transparent;
        animation: drift 10s ease-in-out infinite alternate;
      }

      .loading-screen::after {
        right: -10vw;
        bottom: -15vw;
        background: transparent;
        animation: drift 12s ease-in-out -3s infinite alternate-reverse;
      }

      .loading-grid { position: absolute; z-index: 0; inset: 0; background-image: linear-gradient(rgb(255 210 31 / 13%) 1px, transparent 1px), linear-gradient(90deg, rgb(255 210 31 / 13%) 1px, transparent 1px); background-size: 42px 42px; mask-image: radial-gradient(ellipse at center, black 0%, transparent 70%); opacity: 0.3; transform: none; animation: grid-drift 4s steps(4, end) infinite; }
      .loading-matrix { position: absolute; z-index: 0; inset: 0; display: flex; justify-content: space-evenly; overflow: hidden; color: #ffd21f; font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 24px; font-weight: 700; line-height: 1; opacity: 0.075; pointer-events: none; user-select: none; }
      .loading-orbit, .loading-brand, .loading-text, .loading-code, .loading-progress { position: relative; z-index: 1; }
      .loading-matrix-column { position: relative; top: var(--column-top); display: grid; width: 42px; flex: 0 0 42px; grid-auto-rows: 42px; transform: translateY(0); animation: matrix-fall var(--column-duration) steps(18, end) var(--column-delay) infinite; will-change: transform; }
      .loading-matrix-cell { display: grid; width: 42px; height: 42px; place-items: center; }

      .loading-orbit {
        position: relative;
        display: grid;
        width: 104px;
        height: 104px;
        place-items: center;
        perspective: 500px;
      }

      .loading-orbit-ring {
        position: absolute;
        inset: 8px;
        border: 1px solid #6f5a00;
        border-radius: 50%;
        transform-style: preserve-3d;
      }

      .loading-orbit-ring-back {
        border-top-color: #ffd21f;
        transform: rotateX(66deg) rotateZ(-24deg);
        animation: orbit 1.9s linear infinite;
      }

      .loading-orbit-ring-front {
        inset: 18px 2px;
        border-right-color: #a87900;
        transform: rotateX(66deg) rotateZ(38deg);
        animation: orbit-reverse 1.35s linear infinite;
      }

      .loading-orbit-core {
        display: grid;
        width: 56px;
        height: 56px;
        place-items: center;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
        color: #0a0b0f;
        font-size: 1.45rem;
        font-weight: 900;
        transform-style: preserve-3d;
        animation: breathe 2.2s ease-in-out infinite;
      }
      .loading-orbit-core img { display: block; width: 50px; height: 50px; object-fit: contain; }

      .loading-brand { display: flex; align-items: center; gap: 0.4rem; }
      .loading-title {
        margin: 0;
        font-size: clamp(1.65rem, 4vw, 2.1rem);
        font-weight: 800;
        letter-spacing: -0.055em;
        color: #ffd21f;
      }
      .loading-text { margin: 0; color: #a7a38f; font-size: 0.82rem; letter-spacing: 0.01em; }
      .loading-code { color: #8f8b78; font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 0.68rem; letter-spacing: 0.02em; }
      .loading-code > span:first-child { color: #ffd21f; font-weight: 700; }
      .loading-cursor { margin-left: 0.15rem; color: #ffd21f; animation: cursor 0.9s steps(2, jump-none) infinite; }

      .loading-progress { width: min(210px, 55vw); height: 4px; overflow: hidden; border-radius: 999px; background: #262820; }
      .loading-progress span { display: block; width: 42%; height: 100%; border-radius: inherit; background: #ffd21f; animation: progress 1.35s ease-in-out infinite; }

      @keyframes orbit { to { transform: rotateX(66deg) rotateZ(336deg); } }
      @keyframes orbit-reverse { to { transform: rotateX(66deg) rotateZ(-322deg); } }
      @keyframes breathe { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-4px) scale(1.04); } }
      @keyframes progress { 0% { transform: translateX(-120%); } 100% { transform: translateX(250%); } }
      @keyframes drift { from { transform: translate3d(-12px, 8px, 0) scale(0.92); } to { transform: translate3d(18px, -12px, 0) scale(1.08); } }
      @keyframes cursor { 50% { opacity: 0; } }
      @keyframes grid-drift { to { background-position: 168px 168px; } }
      @keyframes matrix-fall { to { transform: translateY(756px); } }

      @media (prefers-reduced-motion: reduce) {
        .loading-screen::before,
        .loading-screen::after,
        .loading-orbit-ring,
        .loading-orbit-core,
        .loading-grid,
        .loading-matrix,
        .loading-progress span { animation: none; }
      }

      .loading-screen { display: block; background: #111318; }
      .loading-terminal { position: relative; z-index: 1; width: 100%; min-height: 100vh; overflow: hidden; border: 0; border-radius: 0; background: transparent; box-shadow: none; color: #d7dbe2; font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; text-align: left; }
      .loading-terminal-bar { display: flex; height: 38px; align-items: center; gap: 0.8rem; padding: 0 0.85rem; border-bottom: 1px solid #30353d; background: #1c2027; color: #9da5b1; font-size: 0.72rem; }
      .loading-terminal-dots { display: flex; gap: 0.35rem; }
      .loading-terminal-dots i { width: 9px; height: 9px; border-radius: 50%; background: #656c77; }
      .loading-terminal-dots i:first-child { background: #e06c75; }
      .loading-terminal-dots i:nth-child(2) { background: #e5c07b; }
      .loading-terminal-dots i:last-child { background: #98c379; }
      .loading-terminal-status { margin-left: auto; color: #98c379; font-size: 0.64rem; }
      .loading-terminal-body { display: grid; width: min(900px, calc(100vw - 2rem)); min-height: 100vh; align-content: center; gap: 0.7rem; margin: 0 auto; padding: clamp(1rem, 4vw, 1.6rem); }
      .loading-center-icon { display: block; width: 76px; height: 76px; margin: 0 auto 0.9rem; object-fit: contain; }
      .loading-terminal-line { font-size: clamp(0.68rem, 1.5vw, 0.78rem); line-height: 1.5; }
      .loading-terminal-prompt { color: #ffd21f; }
      .loading-terminal-muted { color: #7e8793; }
      .loading-terminal-brand { display: flex; align-items: center; gap: 0.7rem; margin: 0.35rem 0; color: #ffd21f; letter-spacing: 0.16em; }
      .loading-terminal-brand img { width: 30px; height: 30px; object-fit: contain; }
      .loading-terminal-brand strong { font-size: clamp(0.9rem, 2vw, 1.1rem); }
      .loading-terminal-progress { height: 9px; overflow: hidden; border: 1px solid #4c4a26; background: #22251d; }
      .loading-terminal-progress span { display: block; width: 42%; height: 100%; background: #ffd21f; animation: terminal-progress 1.6s steps(9, end) infinite; }
      .loading-terminal-ready { color: #98c379; }
      .loading-terminal-cursor { color: #ffd21f; animation: cursor 0.9s steps(2, jump-none) infinite; }
      @keyframes terminal-progress { 0% { transform: translateX(-110%); } 100% { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .loading-terminal-progress span, .loading-terminal-cursor { animation: none; } }
      .loading-screen { display: flex; align-items: center; justify-content: center; gap: 0; background: #08090c; }
      .loading-center-icon { width: 76px; height: 76px; margin: 0 0 1.5rem; }
      .loading-simple-progress { width: min(220px, 58vw); height: 4px; overflow: hidden; border-radius: 999px; background: #262820; }
      .loading-simple-progress span { display: block; position: relative; left: -45%; width: 45%; height: 100%; border-radius: inherit; background: #ffd21f; animation: simple-progress 1.45s cubic-bezier(.45, .05, .55, .95) infinite; will-change: left; }
      .loading-experience { margin: 0.75rem 0 0; color: #8f8b78; font-family: "SFMono-Regular", Consolas, monospace; font-size: 0.72rem; letter-spacing: 0.04em; }
      @keyframes simple-progress { 0% { left: -45%; } 100% { left: 100%; } }
      @media (prefers-reduced-motion: reduce) { .loading-simple-progress span { animation: none; left: 27.5%; } }
    </style>
  </head>
  <body>
    <main class="loading-screen" role="status" aria-live="polite">
      <img class="loading-center-icon" src="public/favicon.svg" alt="Aftercode">
      <div class="loading-simple-progress" aria-hidden="true"><span></span></div>
      <p class="loading-experience">Loading experience...</p>
    </main>
  </body>
</html>
